name: Test

# Builds, tests and checks the workspace with the same commands a developer runs locally: the root
# `package.json` scripts are the repository's single definition of "clean", so CI and the working
# copy can never disagree about what it means. The unit suite runs first, then test/ — the
# packaged CLI generating every case, tsc over the output and the generated routers served over
# HTTP. `vp run check` is oxfmt, oxlint and the type check, then `pnpm lint`: markdownlint,
# textlint, cspell, secretlint, the TypeSpec release check, and actionlint and zizmor over these
# workflows (downloaded at a pinned, checksummed release).
#
# Actions are pinned to a commit digest, with the @vX.Y.Z tag kept as a comment.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '22'
          cache: true

      - run: vp install --frozen-lockfile

      # test/ drives the packaged CLI and the Vite plugin from dist, so the package is built first.
      - run: vp run wakusei#build

      - run: vp run --filter ./packages/wakusei test

      - run: vp run --filter ./test test

      # The examples commit their generated code: regenerating must leave it unchanged.
      - run: vp run --filter './examples/*' generate
      - run: git diff --exit-code -- examples

      - run: vp run --filter './examples/*' typecheck

      - run: vp run --filter './examples/*' test

      - run: vp run check
