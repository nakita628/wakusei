# zizmor (https://docs.zizmor.sh) audits the workflows; `pnpm lint` runs it through
# scripts/zizmor.ts, locally and in CI alike. A finding is excused here, with its reason, rather
# than by loosening the audit.
rules:
  artipacked:
    ignore:
      # The tag job pushes the tag with the checkout's token, so the credentials have to persist.
      - release.yml:76:9
