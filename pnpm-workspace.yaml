packages:
  - packages/*
  - test
# The e2e TypeSpec document imports @typespec/http. Everything else TypeSpec
# (compiler, openapi3, …) is oas-truth's peer, not a wakusei dependency.
# Strict mode makes `pnpm add` refuse a version outside the catalog; only
# `@typespec/*` belongs here, so move anything else back to its package.json.
catalogMode: strict
catalog:
  '@typespec/http': ^1.16.0
allowBuilds:
  esbuild: false
  # Optional native accelerator pulled in through oas-truth -> schema-truth -> effect ->
  # msgpackr; the JS fallback is enough, so its build script stays off.
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - oas-truth@0.5.1
  - schema-truth@0.7.0
# @effect/platform-node pins effect to one release but takes @effect/platform-node-shared
# with a caret, which resolves to a later release that peers on a newer effect than the
# pinned one. Keep the whole Effect set on the release schema-truth uses.
overrides:
  '@effect/platform-node-shared': 4.0.5
