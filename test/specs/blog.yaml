openapi: 3.1.0
info: { title: Blog, version: 1.0.0 }
paths:
  /posts:
    get:
      summary: List posts
      parameters:
        - $ref: '#/components/parameters/Limit'
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PostStatus' } }
      responses:
        '200':
          description: OK
          headers: { X-Total-Count: { $ref: '#/components/headers/XTotalCount' } }
          content:
            {
              application/json:
                { schema: { type: array, items: { $ref: '#/components/schemas/Post' } } },
            }
    post:
      requestBody: { $ref: '#/components/requestBodies/CreatePost' }
      responses:
        '201':
          {
            description: Created,
            content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
  /posts/{postId}:
    parameters:
      - { name: postId, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      responses:
        '200': { $ref: '#/components/responses/PostFound' }
    put:
      requestBody:
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdatePost' } } }
      responses:
        '200':
          {
            description: Updated,
            content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } },
          }
    delete:
      responses: { '204': { description: No Content } }
  /users/{id}:
    get:
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/User' } } },
          }
  /tree:
    get:
      responses:
        '200':
          {
            description: OK,
            content: { application/json: { schema: { $ref: '#/components/schemas/Node' } } },
          }
webhooks:
  postPublished:
    post:
      requestBody:
        { content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
      responses: { '200': { description: OK } }
components:
  schemas:
    PostStatus: { type: string, enum: [draft, published] }
    Post:
      type: object
      required: [id, title, status]
      properties:
        id: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/PostStatus' }
        replies: { type: array, items: { $ref: '#/components/schemas/Post' } }
        author: { $ref: '#/components/schemas/Author' }
    Author:
      type: object
      properties:
        name: { type: string }
        posts: { type: array, items: { $ref: '#/components/schemas/Post' } }
    Node:
      type: object
      properties:
        children: { type: array, items: { $ref: '#/components/schemas/Node' } }
    CreatePost: { type: object, required: [title], properties: { title: { type: string } } }
    UpdatePost: { type: object, properties: { title: { type: string } } }
    user: { type: object, properties: { login: { type: string } } }
    User: { type: object, required: [id], properties: { id: { type: string } } }
    Error: { type: object, required: [message], properties: { message: { type: string } } }
  parameters:
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
  headers:
    XTotalCount: { schema: { type: integer } }
  requestBodies:
    CreatePost:
      {
        required: true,
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePost' } } },
      }
  responses:
    BadRequest:
      {
        description: Bad request,
        content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
      }
    PostFound:
      {
        description: The post,
        content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } },
      }
  examples:
    Draft: { value: { id: 1, title: Hello, status: draft } }
  securitySchemes:
    Bearer: { type: http, scheme: bearer }
  links:
    GetPost: { operationId: getPost, parameters: { postId: '$response.body#/id' } }
  callbacks:
    OnPublish:
      '{$request.body#/url}':
        post:
          requestBody:
            { content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
          responses: { '200': { description: OK } }
  pathItems:
    Ping: { get: { responses: { '200': { description: pong } } } }
  mediaTypes:
    PostJson: { schema: { $ref: '#/components/schemas/Post' } }
