openapi: 3.1.0
info:
  title: Todo API
  version: '1.0.0'
  description: A small in-memory todo list described by the oRPC contract that wakusei generates.
tags:
  - name: todos
paths:
  /todos:
    get:
      tags: [todos]
      summary: List todos
      parameters:
        - name: status
          in: query
          description: Only return todos with this status.
          schema:
            $ref: '#/components/schemas/TodoStatus'
      responses:
        '200':
          description: The todos, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      tags: [todos]
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodo'
      responses:
        '201':
          description: The created todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
  /todos/{id}:
    parameters:
      - $ref: '#/components/parameters/TodoId'
    get:
      tags: [todos]
      summary: Get a todo
      responses:
        '200':
          description: The todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [todos]
      summary: Update a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodo'
      responses:
        '200':
          description: The updated todo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [todos]
      summary: Delete a todo
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: No todo has this id
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
      required: [message]
    TodoStatus:
      type: string
      enum: [open, done]
    Todo:
      type: object
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/TodoStatus'
        createdAt:
          type: string
          format: date-time
      required: [id, title, status, createdAt]
    CreateTodo:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
      required: [title]
    UpdateTodo:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/TodoStatus'
